name: DEN-779 materialize bounded subprocess capture

on:
  push:
    branches:
      - agent/den-779-bounded-subprocess-output
    paths:
      - '.github/workflows/den-779-materialize-bounded-process.yml'
      - 'Cargo.toml'
      - 'tests/bounded_process_output.rs'

permissions:
  contents: write

concurrency:
  group: den-779-materialize-bounded-process
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'file-tunnel/ftnl-mcp-server.rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-779-bounded-subprocess-output
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse a stale or retargeted patch
        shell: bash
        run: |
          set -euo pipefail
          expected_main='af76e6b68ba1a821afd9eab229b7a78f031101f6'
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git merge-base HEAD origin/main)" = "$expected_main"
          test "$(git branch --show-current)" = 'agent/den-779-bounded-subprocess-output'
          test -z "$(git status --porcelain)"

      - name: Validate this temporary workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/den-779-materialize-bounded-process.yml

      - name: Replace unbounded wait_with_output capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/util.rs')
          text = path.read_text(encoding='utf-8')
          old_imports = '''use std::path::{Path, PathBuf};
          use std::time::Duration;
          '''
          new_imports = '''use std::path::{Path, PathBuf};
          use std::time::Duration;

          use tokio::io::{AsyncRead, AsyncReadExt};
          '''
          old = '''/// Run a command with a timeout; returns (exit_ok, combined stdout+stderr).
          pub async fn run_cmd(
              dir: Option<&Path>,
              program: &str,
              args: &[&str],
              timeout: Duration,
          ) -> Result<(bool, String), String> {
              let mut cmd = tokio::process::Command::new(program);
              cmd.args(args)
                  .stdin(std::process::Stdio::null())
                  .stdout(std::process::Stdio::piped())
                  .stderr(std::process::Stdio::piped())
                  .kill_on_drop(true);
              if let Some(dir) = dir {
                  cmd.current_dir(dir);
              }
              let child = cmd.spawn().map_err(|e| {
                  if e.kind() == std::io::ErrorKind::NotFound {
                      format!("`{program}` not found on PATH: {e}")
                  } else {
                      format!("failed to spawn {program}: {e}")
                  }
              })?;
              let out = tokio::time::timeout(timeout, child.wait_with_output())
                  .await
                  .map_err(|_| format!("`{program} {}` timed out after {timeout:?}", args.join(" ")))?
                  .map_err(|e| format!("{program} failed: {e}"))?;
              let mut text = String::from_utf8_lossy(&out.stdout).into_owned();
              let err = String::from_utf8_lossy(&out.stderr);
              if !err.trim().is_empty() {
                  text.push_str("\n--- stderr ---\n");
                  text.push_str(&err);
              }
              Ok((out.status.success(), text))
          }
          '''
          new = '''/// Default maximum stdout retained from one child process.
          pub const MAX_COMMAND_STDOUT_BYTES: usize = 1024 * 1024;

          /// Default maximum stderr retained from one child process.
          pub const MAX_COMMAND_STDERR_BYTES: usize = 256 * 1024;

          /// Resource limits for one child process.
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct CommandOutputLimits {
              /// Wall-clock deadline.
              pub timeout: Duration,
              /// Maximum stdout bytes accepted before termination.
              pub max_stdout_bytes: usize,
              /// Maximum stderr bytes accepted before termination.
              pub max_stderr_bytes: usize,
          }

          /// Run a command with a timeout and bounded output; returns
          /// `(exit_ok, combined stdout+stderr)`.
          pub async fn run_cmd(
              dir: Option<&Path>,
              program: &str,
              args: &[&str],
              timeout: Duration,
          ) -> Result<(bool, String), String> {
              run_cmd_with_limits(
                  dir,
                  program,
                  args,
                  CommandOutputLimits {
                      timeout,
                      max_stdout_bytes: MAX_COMMAND_STDOUT_BYTES,
                      max_stderr_bytes: MAX_COMMAND_STDERR_BYTES,
                  },
              )
              .await
          }

          /// Run a command while concurrently draining stdout and stderr under
          /// explicit byte and time limits.
          ///
          /// The child is killed and reaped on timeout or the first over-limit
          /// byte. Arguments are deliberately omitted from error strings because
          /// diagnostic commands can contain private paths or operator input.
          pub async fn run_cmd_with_limits(
              dir: Option<&Path>,
              program: &str,
              args: &[&str],
              limits: CommandOutputLimits,
          ) -> Result<(bool, String), String> {
              const MAX_CONFIGURED_CAPTURE: usize = 16 * 1024 * 1024;
              if limits.timeout.is_zero()
                  || !(1..=MAX_CONFIGURED_CAPTURE).contains(&limits.max_stdout_bytes)
                  || !(1..=MAX_CONFIGURED_CAPTURE).contains(&limits.max_stderr_bytes)
              {
                  return Err("invalid subprocess output limits".to_string());
              }

              let mut cmd = tokio::process::Command::new(program);
              cmd.args(args)
                  .stdin(std::process::Stdio::null())
                  .stdout(std::process::Stdio::piped())
                  .stderr(std::process::Stdio::piped())
                  .kill_on_drop(true);
              if let Some(dir) = dir {
                  cmd.current_dir(dir);
              }
              let mut child = cmd.spawn().map_err(|error| {
                  if error.kind() == std::io::ErrorKind::NotFound {
                      format!("`{program}` not found on PATH: {error}")
                  } else {
                      format!("failed to spawn {program}: {error}")
                  }
              })?;
              let stdout = child
                  .stdout
                  .take()
                  .ok_or_else(|| "subprocess stdout pipe is unavailable".to_string())?;
              let stderr = child
                  .stderr
                  .take()
                  .ok_or_else(|| "subprocess stderr pipe is unavailable".to_string())?;

              let operation = async {
                  let wait = async {
                      child
                          .wait()
                          .await
                          .map_err(|error| format!("{program} failed: {error}"))
                  };
                  let stdout = read_pipe_bounded(stdout, limits.max_stdout_bytes, "stdout");
                  let stderr = read_pipe_bounded(stderr, limits.max_stderr_bytes, "stderr");
                  tokio::try_join!(wait, stdout, stderr)
              };

              let result = tokio::time::timeout(limits.timeout, operation).await;
              let (status, stdout, stderr) = match result {
                  Ok(Ok(output)) => output,
                  Ok(Err(error)) => {
                      let _ = child.kill().await;
                      let _ = child.wait().await;
                      return Err(error);
                  }
                  Err(_) => {
                      let _ = child.kill().await;
                      let _ = child.wait().await;
                      return Err(format!(
                          "`{program}` timed out after {:?}",
                          limits.timeout
                      ));
                  }
              };

              let mut text = String::from_utf8_lossy(&stdout).into_owned();
              let stderr = String::from_utf8_lossy(&stderr);
              if !stderr.trim().is_empty() {
                  text.push_str("\n--- stderr ---\n");
                  text.push_str(&stderr);
              }
              Ok((status.success(), text))
          }

          async fn read_pipe_bounded<R>(
              mut reader: R,
              limit: usize,
              stream_name: &str,
          ) -> Result<Vec<u8>, String>
          where
              R: AsyncRead + Unpin,
          {
              let mut output = Vec::new();
              let mut chunk = [0_u8; 8192];
              loop {
                  let read = reader
                      .read(&mut chunk)
                      .await
                      .map_err(|error| format!("reading subprocess {stream_name} failed: {error}"))?;
                  if read == 0 {
                      return Ok(output);
                  }
                  let next = output
                      .len()
                      .checked_add(read)
                      .ok_or_else(|| format!("subprocess {stream_name} length overflow"))?;
                  if next > limit {
                      return Err(format!(
                          "subprocess {stream_name} exceeded the {limit}-byte limit"
                      ));
                  }
                  output.extend_from_slice(&chunk[..read]);
              }
          }
          '''
          if text.count(old_imports) != 1:
              raise SystemExit('util import anchor drifted')
          if text.count(old) != 1:
              raise SystemExit('run_cmd implementation anchor drifted')
          text = text.replace(old_imports, new_imports, 1).replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - name: Run complete validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml \
            .github/workflows/web-smoke.yml \
            .github/workflows/den-779-materialize-bounded-process.yml
          if git grep -n 'wait_with_output' -- src; then
            echo 'unbounded child output capture remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit the reviewed product diff and remove the carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/den-779-materialize-bounded-process.yml
          git add -A
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          git commit -m 'fix(DEN-779): bound subprocess stdout and stderr before buffering'
          git push origin HEAD:agent/den-779-bounded-subprocess-output
