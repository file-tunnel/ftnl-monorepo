name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml .github/workflows/web-smoke.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Release build
        run: cargo build --locked --release
      - name: Enforce runtime, route, and telemetry boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f OBSERVABILITY.md
          test -f docs/mcp-api.md
          test -f src/runtime.rs
          if [ "$(wc -l < src/main.rs)" -gt 8 ]; then
            echo 'src/main.rs must remain a thin binary bootstrap' >&2
            exit 1
          fi
          git grep -qF 'pub async fn run_stdio' -- src/runtime.rs
          git grep -qF 'MAX_OTLP_ENDPOINT_BYTES' -- src/telemetry.rs
          git grep -qF 'MAX_RESOURCE_ATTRIBUTES_RAW_BYTES' -- src/telemetry.rs
          git grep -qF 'MAX_RESOURCE_ATTRIBUTES' -- src/telemetry.rs
          git grep -qF 'sanitize_otlp_endpoint' -- src/telemetry.rs
          git grep -qF '.with_writer(std::io::stderr)' -- src/telemetry.rs
          git grep -qF 'mcp.server.tool.calls' -- src/telemetry.rs
          git grep -qF 'mcp.server.tool.duration' -- src/telemetry.rs
          git grep -qF 'opens no listening port' -- docs/mcp-api.md
          if git grep -nE 'serve\(|telemetry::init|FTNL_API_URL' -- src/main.rs; then
            echo 'runtime lifecycle and configuration diagnostics must not regress into src/main.rs' >&2
            exit 1
          fi
          if git grep -nE '(^|[^[:alnum:]_])print(ln)?!' -- src/main.rs src/runtime.rs src/telemetry.rs; then
            echo 'stdout writes are forbidden in the MCP runtime and telemetry modules' >&2
            exit 1
          fi
          git diff --check
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Dependency audit
        run: cargo audit --deny warnings
