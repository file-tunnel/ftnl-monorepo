name: File Tunnel MCP server

on:
  pull_request:
    paths:
      - 'apps/mcp-server/**'
      - '.github/workflows/ftnl-mcp-server.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mcp-server/**'
      - '.github/workflows/ftnl-mcp-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo +1.85.0 fmt --manifest-path apps/mcp-server/Cargo.toml --all -- --check

      - name: Test
        run: cargo +1.85.0 test --manifest-path apps/mcp-server/Cargo.toml --all-targets

      - name: Clippy
        run: cargo +1.85.0 clippy --manifest-path apps/mcp-server/Cargo.toml --all-targets -- -D warnings

      - name: Release build
        run: cargo +1.85.0 build --manifest-path apps/mcp-server/Cargo.toml --release

      - name: Stdio protocol smoke
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"file_tunnel_plan_transfer","arguments":{"size_bytes":10485760,"chunk_size_bytes":1048576}}}' \
            | cargo +1.85.0 run --quiet --manifest-path apps/mcp-server/Cargo.toml \
            > /tmp/mcp-output.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          lines = [json.loads(line) for line in Path('/tmp/mcp-output.jsonl').read_text().splitlines()]
          assert len(lines) == 2
          assert lines[0]['result']['supportedVersions'][0] == '2026-07-28'
          assert lines[1]['result']['structuredContent']['chunk_count'] == 10
          assert lines[1]['result']['structuredContent']['starts_transfer'] is False
          PY
