name: web-smoke

# Headless-Chromium smoke test against the File Tunnel org's LIVE web surface.
# It hits external sites, so it is intentionally NOT a required PR gate: it runs
# on demand, on a daily schedule, and on push to main.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-smoke
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install Playwright test runner (pinned)
        run: npm i -D @playwright/test@1.49.1
      - name: Install Chromium + OS deps
        run: npx playwright install --with-deps chromium
      - name: Browser smoke against the live file-tunnel site
        run: npx playwright test
