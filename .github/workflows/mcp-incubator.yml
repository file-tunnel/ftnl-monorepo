name: File Tunnel MCP incubator

on:
  push:
    branches: [main]
    paths:
      - "incubator/ftnl-mcp-server.rs/**"
      - ".github/workflows/mcp-incubator.yml"
  pull_request:
    paths:
      - "incubator/ftnl-mcp-server.rs/**"
      - ".github/workflows/mcp-incubator.yml"

permissions:
  contents: read

concurrency:
  group: mcp-incubator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: incubator/ftnl-mcp-server.rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: incubator/ftnl-mcp-server.rs
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release
