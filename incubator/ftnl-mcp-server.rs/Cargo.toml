[package]
name = "ftnl-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Model Context Protocol server for the File Tunnel control-plane API"
license = "MIT"
repository = "https://github.com/file-tunnel/ftnl-monorepo"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3", features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
