[package]
name = "ftnl-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed MCP server for File Tunnel planning and validation"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
